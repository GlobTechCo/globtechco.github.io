<h1>Financial Calculators</h1>

<section class="calculator">
  <h2>Mortgage Calculator</h2>
  <label>Loan amount ($) <input id="loanAmount" type="number" value="300000"></label>
  <label>Interest rate (% per year) <input id="interestRate" type="number" value="6.5" step="0.01"></label>
  <label>Term (years) <input id="loanTerm" type="number" value="30"></label>
  <button onclick="calculateMortgage()">Calculate</button>
  <p id="mortgageResult"></p>
</section>

{% include adsense-slot.html %}

<section class="calculator">
  <h2>Currency Converter</h2>
  <label>Amount <input id="fxAmount" type="number" value="100"></label>
  <label>From <input id="fxFrom" type="text" value="USD" maxlength="3" style="text-transform:uppercase"></label>
  <label>To <input id="fxTo" type="text" value="EUR" maxlength="3" style="text-transform:uppercase"></label>
  <button onclick="convertCurrency()">Convert</button>
  <p id="fxResult"></p>
</section>

<script>
function calculateMortgage() {
  const principal = parseFloat(document.getElementById('loanAmount').value);
  const annualRate = parseFloat(document.getElementById('interestRate').value) / 100;
  const years = parseFloat(document.getElementById('loanTerm').value);

  const monthlyRate = annualRate / 12;
  const numPayments = years * 12;

  let monthlyPayment;
  if (monthlyRate === 0) {
    monthlyPayment = principal / numPayments;
  } else {
    monthlyPayment = principal * (monthlyRate * Math.pow(1 + monthlyRate, numPayments)) /
                      (Math.pow(1 + monthlyRate, numPayments) - 1);
  }

  const totalPaid = monthlyPayment * numPayments;
  const totalInterest = totalPaid - principal;

  document.getElementById('mortgageResult').innerHTML =
    `Monthly payment: $${monthlyPayment.toFixed(2)}<br>` +
    `Total interest over ${years} years: $${totalInterest.toFixed(2)}<br>` +
    `Total paid: $${totalPaid.toFixed(2)}`;
}

// Uses frankfurter.app - a free, no-API-key-required exchange rate API
async function convertCurrency() {
  const amount = document.getElementById('fxAmount').value;
  const from = document.getElementById('fxFrom').value.toUpperCase();
  const to = document.getElementById('fxTo').value.toUpperCase();

  document.getElementById('fxResult').innerText = 'Loading...';

  try {
    const res = await fetch(`https://api.frankfurter.app/latest?amount=${amount}&from=${from}&to=${to}`);
    const data = await res.json();
    const converted = data.rates[to];
    document.getElementById('fxResult').innerText = `${amount} ${from} = ${converted} ${to}`;
  } catch (e) {
    document.getElementById('fxResult').innerText = 'Could not fetch exchange rate. Please try again.';
  }
}
</script>
