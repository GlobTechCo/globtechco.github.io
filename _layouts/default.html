<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}
  {% feed_meta %}

  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <div class="ticker-wrap">
    <div class="ticker-track mono" id="tickerTrack">
      <span>Loading market data…</span>
    </div>
  </div>

  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">News</a>
      <a href="{{ '/markets/' | relative_url }}">Markets</a>
      <a href="{{ '/calculators/' | relative_url }}">Calculators</a>
      <a href="{{ '/personal-finance/' | relative_url }}">Personal Finance</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  {% include adsense-slot.html %}

  <footer class="site-footer">
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}</p>
  </footer>

  <script>
  // Live FX ticker - free, no API key (frankfurter.dev)
  (async function loadTicker() {
    const track = document.getElementById('tickerTrack');
    const pairs = ['EUR', 'GBP', 'JPY', 'CHF', 'CAD'];
    const end = new Date();
    const start = new Date();
    start.setDate(end.getDate() - 7);
    const fmt = d => d.toISOString().slice(0, 10);

    try {
      const res = await fetch(`https://api.frankfurter.dev/v1/${fmt(start)}..${fmt(end)}?from=USD&to=${pairs.join(',')}`);
      if (!res.ok) throw new Error('bad response');
      const data = await res.json();
      const dates = Object.keys(data.rates).sort();
      const first = data.rates[dates[0]];
      const last = data.rates[dates[dates.length - 1]];

      let html = '';
      pairs.forEach(p => {
        if (first[p] && last[p]) {
          const change = ((last[p] - first[p]) / first[p]) * 100;
          const dir = change >= 0 ? 'up' : 'down';
          const arrow = change >= 0 ? '▲' : '▼';
          html += `<span>USD/${p} <b>${last[p].toFixed(3)}</b> <span class="${dir}">${arrow} ${Math.abs(change).toFixed(2)}%</span></span>`;
        }
      });
      // duplicate content for seamless scroll
      track.innerHTML = html ? html + html : '<span>No market data returned.</span>';
    } catch (e) {
      track.innerHTML = '<span>Market data unavailable right now.</span>';
    }
  })();
  </script>
</body>
</html>
