<h1 id="tickerHeading">Loading quote…</h1>
<p>Enter a ticker in the URL like <code>/quote/?symbol=AAPL</code>, or use the box below.</p>

<label>Ticker symbol <input id="tickerInput" type="text" placeholder="AAPL"></label>
<button onclick="loadTicker()">Load</button>

<div id="tradingview_chart" style="height:500px; margin-top:20px;"></div>

{% include adsense-slot.html %}

<script src="https://s3.chart-static.tradingview.com/tv.js"></script>
<script>
function getSymbolFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return (params.get('symbol') || 'AAPL').toUpperCase();
}

function loadTicker() {
  const manual = document.getElementById('tickerInput').value.trim().toUpperCase();
  const symbol = manual || getSymbolFromUrl();
  const url = new URL(window.location);
  url.searchParams.set('symbol', symbol);
  window.history.replaceState({}, '', url);
  renderChart(symbol);
}

function renderChart(symbol) {
  document.getElementById('tickerHeading').innerText = symbol;
  document.getElementById('tradingview_chart').innerHTML = '';
  new TradingView.widget({
    "width": "100%",
    "height": 500,
    "symbol": symbol,
    "interval": "D",
    "timezone": "Etc/UTC",
    "theme": "light",
    "style": "1",
    "locale": "en",
    "toolbar_bg": "#f1f3f6",
    "enable_publishing": false,
    "allow_symbol_change": true,
    "container_id": "tradingview_chart"
  });
}

renderChart(getSymbolFromUrl());
</script>
