name: Auto-generate finance content

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours; adjust as needed
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run content generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          RSS_FEEDS: ${{ vars.RSS_FEEDS }}
          MAX_ARTICLES_PER_RUN: "1"
        run: python scripts/generate_content.py

      - name: Commit and push if there are changes
        run: |
          git config user.name "auto-finance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _posts _data/aggregator.yml scripts/seen_items.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-content update $(date -u +%Y-%m-%d)"
          git push
